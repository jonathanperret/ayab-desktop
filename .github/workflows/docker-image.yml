# Builds the four images from docker/Dockerfile (see docker/README.md), checks
# that AYAB starts in each, and pushes them to the GitHub Container Registry
# as ghcr.io/<owner>/ayab-<target>. Pull requests only build and check.
#
# The release images are checked with the latest AYAB release, the source
# images with this checkout (their first start sets up the Python
# environment).

name: Docker images

on:
  push:
    branches: ["**"]
    tags: ["*"]
    paths:
      - docker/**
      - requirements*.txt
      - windows-build/windows_build_requirements.txt
      - .github/workflows/docker-image.yml
  pull_request:
    paths:
      - docker/**
      - requirements*.txt
      - windows-build/windows_build_requirements.txt
      - .github/workflows/docker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-release
            run: /release/AYAB.AppImage
          - target: linux-source
            run: source-linux
          - target: wine-release
            run: /release/AYAB.exe
          - target: wine-source
            run: source-wine
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        # Registry image names must be lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ayab-${{ matrix.target }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: ayab:test
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

      - name: Download the latest AYAB release
        if: endsWith(matrix.target, '-release')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          gh release download --repo AllYarnsAreBeautiful/ayab-desktop \
            --pattern '*.AppImage' --pattern '*.exe' --dir release
          mv release/*.AppImage release/AYAB.AppImage
          mv release/*.exe release/AYAB.exe
          chmod +x release/AYAB.AppImage

      - name: Check that AYAB starts
        run: |
          mkdir -p release  # only filled for release images
          docker run --detach --name ayab \
            --mount "type=bind,source=$PWD,target=/workspace" \
            --mount "type=bind,source=$PWD/release,target=/release" \
            ayab:test ${{ matrix.run }}
          # Up to 20 minutes: source images first set up their environment
          for i in $(seq 600); do
            if docker exec ayab sh -c \
                'xwininfo -root -tree | grep -qE "\"(AYAB|All Yarns Are Beautiful)"' 2>/dev/null; then
              sleep 5  # let the window finish drawing
              docker exec ayab sh -c 'xwininfo -root -tree | grep -E "\"(AYAB|All Yarns Are Beautiful)"'
              docker exec ayab maim > screenshot.png
              docker logs ayab
              exit 0
            fi
            if [ -z "$(docker ps --quiet --filter name=^ayab\$)" ]; then
              break
            fi
            sleep 2
          done
          echo "::error::AYAB did not start"
          docker logs ayab
          exit 1

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.target }}
          path: screenshot.png
          if-no-files-found: ignore

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Branch or tag name, commit SHA, and latest: every push updates
          # latest, whatever the branch
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
