# Builds the Docker image from docker/Dockerfile (see docker/README.md),
# checks that AYAB starts in it from source on Linux and under Wine, and
# pushes it to the GitHub Container Registry as
# ghcr.io/<owner>/ayab-desktop. Pull requests only build and check.

name: Docker image

on:
  push:
    branches: ["**"]
    tags: ["*"]
    paths:
      - docker/**
      - requirements*.txt
      - windows-build/windows_build_requirements.txt
      - .github/workflows/docker-image.yml
  pull_request:
    paths:
      - docker/**
      - requirements*.txt
      - windows-build/windows_build_requirements.txt
      - .github/workflows/docker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        # Registry image names must be lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ayab-desktop" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runner
          platforms: linux/amd64
          load: true
          tags: ayab:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check that AYAB starts
        run: |
          check() {
            mode=$1
            docker run --detach --name "ayab-$mode" \
              --mount "type=bind,source=$PWD,target=/workspace" \
              ayab:test "source-$mode"
            for i in $(seq 120); do
              if docker exec "ayab-$mode" sh -c \
                  'xwininfo -root -tree | grep -q "\"AYAB"' 2>/dev/null; then
                sleep 5  # let the window finish drawing
                docker exec "ayab-$mode" sh -c 'xwininfo -root -tree | grep "\"AYAB"'
                docker exec "ayab-$mode" maim > "screenshot-$mode.png"
                docker rm --force "ayab-$mode" >/dev/null
                return 0
              fi
              if [ -z "$(docker ps --quiet --filter "name=^ayab-$mode\$")" ]; then
                break
              fi
              sleep 2
            done
            echo "::error::AYAB did not start ($mode)"
            docker logs "ayab-$mode"
            return 1
          }
          check linux
          check wine

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshot-*.png
          if-no-files-found: ignore

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Branch or tag name, commit SHA, and latest for the default branch
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
